{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ static_url('css/action_history.css') }}">
{% endblock %}

{% block title %}Action History — Steam Market Trader{% endblock %}

{% block content %}
<h1 class="page-name">Action History</h1>

<div class="filter-bar">
    <label for="level-filter">Show</label>
    <select id="level-filter">
        <option value="">Everything</option>
        {% for level in levels %}
        <option value="{{ level }}">{{ level|title }} and nothing else</option>
        {% endfor %}
    </select>
    <span class="filter-hint" id="entry-count"></span>
    <button type="button" id="clear-history" class="btn danger small"
            title="Delete every entry. Entries older than 30 days are removed automatically.">
        Clear history
    </button>
</div>

<div class="table-scroll">
    <table class="action-table">
        <thead>
        <tr>
            <th data-sort="occurred_at" title="When the bot did this">When</th>
            <th data-sort="kind" data-sort-default="ascending" title="What kind of event this was">Event</th>
            <th data-sort="market_hash_name" data-sort-default="ascending" title="The item the event concerns">Item</th>
            <th title="What happened">Details</th>
        </tr>
        </thead>
        <tbody id="action-body">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
        </tbody>
    </table>
</div>

<div id="actions-pager" hidden></div>
{% endblock %}

{% block extra_js %}
<script src="{{ static_url('js/action_history.js') }}" defer></script>
{% endblock %}
