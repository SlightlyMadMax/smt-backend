<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>{% block title %}Steam Market Trader{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('css/base.css') }}"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <h1 class="site-logo"><a href="/">Steam Market Trader</a></h1>
    <nav class="main-nav">
      <ul>
        <li>
          Inventory
          <ul class="submenu">
            <li><a href="/inventory?game=CS">CS:GO</a></li>
            <li><a href="/inventory?game=TF2">TF2</a></li>
            <li><a href="/inventory?game=DOTA2">Dota 2</a></li>
            <li><a href="/inventory?game=STEAM">Steam</a></li>
          </ul>
        </li>
        <li><a href="/pool">Pool</a></li>
        <li><a href="/trade-market">Trade Market</a></li>
        <li><a href="/action-history">Action History</a></li>
        <li><a href="/settings">Settings</a></li>
        <li><a href="#" aria-disabled="true" title="Not implemented yet">Statistics</a></li>
      </ul>
    </nav>

    <span class="wallet" title="Steam wallet balance">
      <span class="wallet-label">Wallet</span>
      <strong id="wallet-balance">…</strong>
    </span>
  </header>

  <main class="site-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ static_url('js/common.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
